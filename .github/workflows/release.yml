name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: zip -r youtube-shorts-autoscroll-${GITHUB_REF_NAME}.zip manifest.json content.js background.js icons LICENSE
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" youtube-shorts-autoscroll-*.zip --generate-notes
