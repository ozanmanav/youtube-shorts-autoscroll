name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check content.js && node --check background.js
      - name: Validate manifest
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (m.manifest_version !== 3) throw new Error("manifest_version must be 3");
            const files = [m.background.service_worker, ...m.content_scripts.flatMap(c => c.js), ...Object.values(m.icons)];
            for (const f of files) if (!fs.existsSync(f)) throw new Error("missing file: " + f);
            console.log("manifest OK, version", m.version);
          '
